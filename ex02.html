<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style> 
        body { 
            background-color: rgb(109, 161, 165)
        }
        div#area{
                background: rgb(144, 183, 228);
                color: rgb(250, 252, 252);
                width: 200px;
                height: 200px;
                text-align: center;
                line-height: 200px;
                font-size: 20pt;
                font-family: Arial, Helvetica, sans-serif;
                
        }
    </style>

</head>
<body>
    <h1> Eventos DOM</h1>
    <div id="area" onclick="clicar()" onmouseenter="entrou()" onmouseout="saiu()"> Interaja</div>
    <p> Eventos DOM: mouseenter; mouseout;mousemove;mouseup;mousedom;click</p>
    <a href="ex00.html" rel="next">Voltar</a>
    <script>
        function clicar() {
            var a = document.getElementById('area')
            a.innerHTML = 'clicou'
            a.style.background= 'green'
        }
        function entrou(){
            var a = document.getElementById('area')
            a.innerHTML = 'entrou'
            a.style.background= 'black'
        }
        function saiu(){
            var a = document.querySelector('div#area')
            a.innerHTML = 'saiu'
            a.style.background= 'aquamarine'
        }
    </script>
</body>
</html>
